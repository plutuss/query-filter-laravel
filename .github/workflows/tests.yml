name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.0'
            laravel: '^9.0'
          - php: '8.1'
            laravel: '^10.0'
          - php: '8.2'
            laravel: '^11.0'
          - php: '8.3'
            laravel: '^12.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
      # Legacy Laravel versions are included to check PHP 8.0/8.1 compatibility.
      - run: composer config audit.block-insecure false
      - run: composer require --dev 'laravel/framework:${{ matrix.laravel }}' --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
