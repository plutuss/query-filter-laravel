name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Find version tag on tested commit
        id: version
        run: |
          tag=$(git tag --points-at HEAD --sort=-version:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          # A workflow-only repair may follow an already tested release tag.
          # Recover that version only when every packaged file still matches it.
          if [ -z "$tag" ]; then
            version=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+ / { print $2; exit }' CHANGELOG.md)
            if [ -n "$version" ] && \
              git rev-parse --verify "refs/tags/$version" > /dev/null 2>&1 && \
              git merge-base --is-ancestor "$version" HEAD && \
              git diff --quiet "$version" HEAD -- . ':(exclude).github/workflows'; then
              tag=$version
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          awk -v version="$RELEASE_TAG" '
            index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
